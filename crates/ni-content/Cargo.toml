[package]
name = "deckard-ni-content"
version = "0.1.0"
edition = "2024"
description = "Read-only installed NI content discovery and portable metadata"
[dependencies]
quick-xml = "0.41"
plist = "1"
mxprj = { path = "../mxprj" }
toml = "0.9"
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Registry", "Win32_System_Environment"] }
[dev-dependencies]
tempfile = "3.27.0"

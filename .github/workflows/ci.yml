# Build and test on macOS, Linux and Windows for every push to main and every pull
# request. Tests that need a Maschine install or projects skip themselves here.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
          - name: Linux
            os: ubuntu-22.04
          - name: Windows
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # The pinned Rust and tools (mise.toml).
      - uses: jdx/mise-action@v2
      - uses: Swatinem/rust-cache@v2
      - name: Linux packages
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libasound2-dev
      - name: Lint
        if: runner.os == 'Linux'
        run: mise run lint
      - name: Build
        run: cargo build --workspace --all-targets --locked
      - name: Test
        run: cargo test --workspace --locked --no-fail-fast
      - name: Native MIDI loopback
        if: runner.os == 'macOS'
        run: cargo test --locked -p deckard native_midi_ -- --ignored --test-threads=1

  # At least 70% of the lines a pull request adds or changes must run under the tests.
  # Combine the default suite and explicit native MIDI checks on macOS, where
  # CoreMIDI virtual ports are available. Keep the three-platform correctness jobs.
  # Tests needing unavailable local data still count as not covered.
  coverage:
    name: Patch coverage
    if: github.event_name == 'pull_request'
    runs-on: macos-latest
    permissions:
      contents: read
      # The coverage comment.
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          # The base branch too, to diff against.
          fetch-depth: 0
      - uses: jdx/mise-action@v2
      - uses: Swatinem/rust-cache@v2
      - name: Coverage tools
        run: rustup component add llvm-tools-preview
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov@0.9.1
      - name: Measure coverage
        run: |
          cargo llvm-cov clean --workspace
          cargo llvm-cov --workspace --locked --no-report
          cargo llvm-cov -p deckard --locked --no-report -- native_midi_ --ignored --test-threads=1
          cargo llvm-cov report --cobertura --output-path coverage.xml
      # diff-cover 11 needs Python 3.11 or later.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: At least 70% of changed lines covered
        run: |
          python -m pip install diff-cover==11.0.1
          diff-cover coverage.xml --compare-branch="origin/$BASE_REF" --fail-under=70 \
            --format markdown:coverage.md
        env:
          BASE_REF: ${{ github.base_ref }}
      - name: Report
        if: always()
        run: test -f coverage.md && cat coverage.md >> "$GITHUB_STEP_SUMMARY" || true
      # A coverage table as a comment on the pull request, updated on each push. It only
      # reports: the step above enforces the 70%. Pull requests from forks get a
      # read-only token, so the comment can fail there without failing the check.
      - name: Comment on the pull request
        if: always() && hashFiles('coverage.xml') != ''
        continue-on-error: true
        uses: orgoro/coverage@ca0c362dc1a4f100447309405e6dfea47e251495 # v3.3.1
        with:
          coverageFile: coverage.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          sourceDir: ${{ github.workspace }}

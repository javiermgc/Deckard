name: ALSA sequencer investigation

on:
  push:
    branches: [codex/investigate-linux-midi-ci]

permissions:
  contents: read

jobs:
  diagnose:
    name: Diagnose ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - name: Inspect fresh runner
        shell: python
        run: |
          import os
          import subprocess
          kernel = os.uname().release
          print({key: os.environ.get(key) for key in ("ImageOS", "ImageVersion")}, flush=True)
          commands = [
              ["uname", "-a"], ["id"], ["sudo", "-n", "true"],
              ["cat", "/etc/os-release"],
              ["ls", "-ld", "/dev/snd", "/proc/asound", "/sys/module/snd_seq", f"/lib/modules/{kernel}"],
              ["modinfo", "snd_seq"], ["modinfo", "snd_dummy"],
              ["modprobe", "--dry-run", "--verbose", "snd_seq"],
              ["grep", "^snd", "/proc/modules"],
              ["grep", "-E", "CONFIG_(SOUND|SND)([ =_]|$)", f"/boot/config-{kernel}"],
              ["apt-cache", "policy", f"linux-modules-{kernel}", f"linux-modules-extra-{kernel}"],
          ]
          for command in commands:
              print(f"::group::{command}", flush=True)
              try:
                  result = subprocess.run(command, check=False)
                  print(f"Exit code: {result.returncode}", flush=True)
              except OSError as error:
                  print(f"Diagnostic unavailable: {error}", flush=True)
              print("::endgroup::", flush=True)
      - name: Install ALSA diagnostic tools
        run: sudo apt-get update && sudo apt-get install -y alsa-utils
      - name: Inspect MIDI and audio availability
        shell: python
        run: |
          import subprocess
          for command in (["ls", "-l", "/dev/snd"], ["aconnect", "-l"], ["aplay", "-l"], ["aplay", "-L"]):
              print(f"::group::{command}", flush=True)
              try:
                  result = subprocess.run(command, check=False)
                  print(f"Exit code: {result.returncode}", flush=True)
              except OSError as error:
                  print(f"Diagnostic unavailable: {error}", flush=True)
              print("::endgroup::", flush=True)
      - name: Inspect exact-kernel module package
        shell: python
        run: |
          import os
          import pathlib
          import subprocess
          package = f"linux-modules-extra-{os.uname().release}"
          for command in (["apt-cache", "policy", package], ["apt-get", "download", package]):
              result = subprocess.run(command, check=False)
              print(f"{command}: exit {result.returncode}", flush=True)
          for archive in pathlib.Path(".").glob("linux-modules-extra-*.deb"):
              result = subprocess.run(["dpkg-deb", "--contents", str(archive)], check=True, text=True, capture_output=True)
              lines = result.stdout.splitlines()
              matches = [line for line in lines if "/sound/" in line or "snd-seq.ko" in line or "snd-dummy.ko" in line]
              print(f"Inspected {archive}: {len(lines)} entries; sound-related entries: {len(matches)}", flush=True)
              for line in matches:
                  print(line, flush=True)
      - name: Require an accessible sequencer (baseline)
        run: |
          test -c /dev/snd/seq
          test -r /dev/snd/seq
          test -w /dev/snd/seq
          aconnect -l
